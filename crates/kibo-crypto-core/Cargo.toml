[package]
name = "kibo-crypto-core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
# Published to crates.io (the `k9o` Rust SDK depends on it); the rest of the
# workspace stays `publish = false`.
publish = true
repository = "https://github.com/k9o-dev/kibo-kms-rest"
description = "Public raw-crypto primitives: AES-256-GCM-SIV AEAD, DEK lifecycle, HKDF-SHA-256 KDF, versioned ciphertext envelope format, shared boundary types"

[lints]
workspace = true

[dependencies]
aes-gcm-siv = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
rand_core = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
